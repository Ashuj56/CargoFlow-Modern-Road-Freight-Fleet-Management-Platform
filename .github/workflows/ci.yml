name: CI — Build & Push to ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:

  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run tests
        run: cd backend && npm test
        env:
          NODE_ENV: test


  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push — backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/cargoflow-backend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/cargoflow-backend:latest

      - name: Build & push — customer-portal
        uses: docker/build-push-action@v5
        with:
          context: ./customer-portal
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/cargoflow-customer-portal:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/cargoflow-customer-portal:latest

      - name: Build & push — owner-portal
        uses: docker/build-push-action@v5
        with:
          context: ./owner-portal
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/cargoflow-owner-portal:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/cargoflow-owner-portal:latest


  update-manifests:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ashuj56/CargoFlow-k8s
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Update image tags in manifests
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          ECR="${{ env.ECR_REGISTRY }}"

          # Update backend image tag
          sed -i "s|${ECR}/cargoflow-backend:.*|${ECR}/cargoflow-backend:${IMAGE_TAG}|g" \
            gitops/backend/deployment.yaml

          # Update customer-portal image tag
          sed -i "s|${ECR}/cargoflow-customer-portal:.*|${ECR}/cargoflow-customer-portal:${IMAGE_TAG}|g" \
            gitops/customer-portal/deployment.yaml

          # Update owner-portal image tag
          sed -i "s|${ECR}/cargoflow-owner-portal:.*|${ECR}/cargoflow-owner-portal:${IMAGE_TAG}|g" \
            gitops/owner-portal/deployment.yaml

      - name: Commit and push manifest changes
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m \
            "chore: update image tags to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
          git push
