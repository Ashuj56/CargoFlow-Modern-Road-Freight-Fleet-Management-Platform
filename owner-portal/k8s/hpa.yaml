apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: owner-portal-hpa
  labels:
    app: cargoflow-owner-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cargoflow-owner-portal
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 85
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
