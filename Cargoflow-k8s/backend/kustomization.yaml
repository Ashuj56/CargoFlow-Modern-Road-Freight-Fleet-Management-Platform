apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

secretGenerator:
  - name: backend-secrets
    envs:
      - .env.secrets

commonLabels:
  app.kubernetes.io/name: cargoflow-backend
  app.kubernetes.io/part-of: cargoflow
