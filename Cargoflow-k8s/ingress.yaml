# ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cargoflow-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cargoflow-backend
                port:
                  number: 5000
          - path: /owner
            pathType: Prefix
            backend:
              service:
                name: owner-portal
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-portal
                port:
                  number: 3000
